apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: chat-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/diabelmehdi/chat-demo-backend:latest
          ports:
            - containerPort: 3000
          env:
            - name: REDIS_URL
              value: "redis://redis.chat-demo.svc.cluster.local:6379"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: chat-demo
spec:
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000
