apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chat-demo
  namespace: chat-demo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - elmehdi.chat-demo.devel.techcast.cloud
      secretName: chat-demo-tls
  rules:
    - host: elmehdi.chat-demo.devel.techcast.cloud
      http:
        paths:
          - path: /rta
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
